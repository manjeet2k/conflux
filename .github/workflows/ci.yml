name: CI

# Windows only: Windows is the only supported platform. Runner minutes cost money on private
# repos (Windows counts double), so skip runs that cannot change build or test results.
# The Linux/WSL2 dev loop is documented in docs/DEVELOPMENT.md (scripts/test-windows.sh runs
# the tests as real Windows executables locally).
on:
  pull_request:
    paths-ignore: &docs_only
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore: *docs_only
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Version consistency
        run: node scripts/check-version.mjs
      - name: Format
        run: cargo fmt --check
      # conflux-desktop embeds ui/dist at compile time, so build the UI first.
      - name: UI install
        run: npm --prefix ui ci
      - name: UI lint
        run: npm --prefix ui run lint
      - name: UI build
        run: npm --prefix ui run build
      - name: Clippy (core, cli, desktop)
        run: cargo clippy -p conflux-core -p conflux-cli -p conflux-desktop --tests -- -D warnings
      - name: Test (core, cli, desktop)
        run: cargo test -p conflux-core -p conflux-cli -p conflux-desktop
