name: Release

# Builds the Windows installers from a version tag and attaches them to a DRAFT GitHub
# prerelease. Nothing is public until a maintainer reviews and publishes the draft; publishing
# it (the `release: published` event) then points the in-app updater at it. Runbook:
# docs/RELEASING.md. Never runs on pull requests (Windows minutes are billed double).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.2.0-beta.1"
        required: true
        type: string
      publish_manifest:
        description: "Recovery: do NOT build; only publish latest.json of the already PUBLISHED release for this tag (use when the release:published run failed)"
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    # The `release: published` trigger (and the publish_manifest recovery input) belong to the
    # publish-updater job only.
    if: github.event_name != 'release' && !inputs.publish_manifest
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create/update the draft release and upload assets
    # One build per tag; never cancel a half-uploaded release.
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    # Secrets/approval gate: the maintainer creates the `release` environment with required
    # reviewers and keeps the TAURI_SIGNING_* secrets there (docs/RELEASING.md). Until then it
    # is auto-created without protection and repository-level secrets still work.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v0.2.0-beta.1"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # A published release is immutable: re-running the build must never silently replace the
      # assets users (and the updater manifest) already point at. Only a missing release or a
      # DRAFT may be (re)built. Lists releases instead of `gh release view <tag>` because the
      # tag endpoint does not return drafts.
      - name: Refuse to rebuild a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          STATES="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.tag_name == env.TAG) | if .draft then "draft" else "published" end')"
          echo "existing releases for $TAG: ${STATES:-none}"
          if grep -qx published <<<"$STATES"; then
            echo "::error::Release $TAG is already published. Never rebuild a published release: to fix it, cut a new beta number (docs/RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0 # full history for the ancestor check below

      # Only code that reached main may be released; a tag on a side branch is refused.
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) (tag ${{ steps.meta.outputs.tag }}) is not an ancestor of origin/main."
            exit 1
          fi

      # Aborts here when the tag and the version files disagree.
      - name: Check tag matches the version files
        run: node scripts/check-version.mjs --expect "${{ steps.meta.outputs.version }}"

      - name: Install pinned Rust toolchain (rust-toolchain.toml, MSVC target)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install and build
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Third-party licenses are up to date
        run: node scripts/gen-licenses.mjs --check

      # Fails (no fallback to Unreleased) when CHANGELOG.md has no section for this version.
      - name: Release notes from CHANGELOG.md
        run: node scripts/extract-changelog.mjs "${{ steps.meta.outputs.version }}" > release-notes.md

      # Standard installer (downloads the WebView2 bootstrapper when needed) plus the updater
      # artifacts (.sig). The Tauri CLI is built directly instead of through tauri-action:
      # that action runs `tauriScript` as `npm run <script...>`, which cannot express "the CLI
      # lives in ui/, the app in crates/conflux-desktop". The draft release itself is created
      # by the upload step below. The CLI binary is run directly from crates/conflux-desktop:
      # `npm --prefix ../../ui run tauri` would start it with ui/ as the working directory and the
      # CLI would not find tauri.conf.json. BETA POLICY: always a draft AND a prerelease.
      - name: Build NSIS installer
        working-directory: crates/conflux-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Everything after the second `--` goes to cargo: --locked refuses to touch Cargo.lock.
        run: ../../ui/node_modules/.bin/tauri build --bundles nsis -- --locked

      - name: Stage the standard installer
        run: |
          V="${{ steps.meta.outputs.version }}"
          NSIS=target/release/bundle/nsis
          mkdir -p dist-installer
          for f in "Conflux_${V}_x64-setup.exe" "Conflux_${V}_x64-setup.exe.sig"; do
            test -f "$NSIS/$f" || { echo "::error::missing $NSIS/$f"; ls -la "$NSIS"; exit 1; }
            cp "$NSIS/$f" dist-installer/
          done

      # R-4: second build with the WebView2 runtime embedded (~130 MB) for offline or locked-down
      # machines. Tauri names both installers alike, so it is renamed. It has no updater
      # artifacts and is never listed in latest.json.
      - name: Build offline-WebView2 installer
        working-directory: crates/conflux-desktop
        run: |
          V="${{ steps.meta.outputs.version }}"
          ../../ui/node_modules/.bin/tauri build --bundles nsis --config tauri.offline.conf.json -- --locked
          SRC="../../target/release/bundle/nsis/Conflux_${V}_x64-setup.exe"
          test -f "$SRC" || { echo "::error::missing $SRC"; exit 1; }
          cp "$SRC" "../../dist-installer/Conflux_${V}_x64-offline-setup.exe"

      - name: SHA256SUMS.txt and updater manifest
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cd dist-installer
          sha256sum "Conflux_${VERSION}_x64-setup.exe" "Conflux_${VERSION}_x64-offline-setup.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Only the standard installer is in the manifest (the offline one has no signature).
          node - <<'EOF'
          const fs = require("fs");
          const { TAG, VERSION, REPO } = process.env;
          const name = `Conflux_${VERSION}_x64-setup.exe`;
          const manifest = {
            version: VERSION,
            notes: fs.readFileSync("../release-notes.md", "utf8").trim(),
            pub_date: new Date().toISOString(),
            platforms: {
              "windows-x86_64": {
                signature: fs.readFileSync(`${name}.sig`, "utf8").trim(),
                url: `https://github.com/${REPO}/releases/download/${TAG}/${name}`,
              },
            },
          };
          fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          EOF
          cat latest.json

      # Optional: a prebuilt cargo-cyclonedx keeps this cheap (no compiling it). If the tool
      # cannot be installed or fails, the SBOM is skipped and the release continues.
      - name: Install cargo-cyclonedx
        id: cdx_tool
        continue-on-error: true
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx
      - name: SBOM (CycloneDX)
        if: steps.cdx_tool.outcome == 'success'
        continue-on-error: true
        run: |
          cargo cyclonedx --format json
          cp crates/conflux-desktop/conflux-desktop.cdx.json "dist-installer/Conflux_${{ steps.meta.outputs.version }}_sbom.cdx.json"

      # D-5: skipped unless the VIRUSTOTAL_API_KEY secret exists. Scans the standard installer
      # (the offline one exceeds free-tier upload limits). Detections are for a human to judge.
      # The key is only exposed to these two steps (secrets cannot be tested in `if:` directly).
      - name: Is VirusTotal configured
        id: vt_cfg
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: echo "enabled=$([ -n "$VT_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: VirusTotal scan
        id: vt
        if: steps.vt_cfg.outputs.enabled == 'true'
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@d34968c958ae283fe976efed637081b9f9dcf74f # v4.2.0
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: |
            dist-installer/Conflux_*_x64-setup.exe
      - name: VirusTotal report link in job summary
        if: steps.vt_cfg.outputs.enabled == 'true' && steps.vt.outputs.analysis != ''
        env:
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          {
            echo "### VirusTotal"
            echo
            echo "$ANALYSIS" | tr ',' '\n' | sed 's/^/- /'
            echo
            echo "Review detections before publishing the draft (see docs/RELEASING.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the draft release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Conflux ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          # Keep the beta policy: never published automatically, always flagged prerelease.
          draft: true
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: false
          files: |
            dist-installer/Conflux_*_x64-setup.exe
            dist-installer/Conflux_*_x64-setup.exe.sig
            dist-installer/Conflux_*_x64-offline-setup.exe
            dist-installer/SHA256SUMS.txt
            dist-installer/latest.json
            dist-installer/*_sbom.cdx.json

      - name: Summary
        run: |
          {
            echo "### Draft release ${{ steps.meta.outputs.tag }}"
            echo
            echo "Review it under Releases, verify \`SHA256SUMS.txt\`, smoke-test, then publish."
            echo "Publishing triggers the \`publish-updater\` job, which updates \`updater-beta/latest.json\`."
            echo
            echo '```'
            cat dist-installer/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Runs when a maintainer publishes the reviewed draft. Only now do installed copies learn
  # about the version: latest.json on the fixed `updater-beta` release is what the app polls
  # (`releases/latest/download/` ignores prereleases and private repos, so it cannot be used).
  publish-updater:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialise manifest writes; the newest publish wins.
    concurrency:
      group: updater-manifest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Tag must look like a release tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a release tag like v0.2.0-beta.1"; exit 1; }
      # Scripts and the updater public key come from the tagged commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::tag $TAG is not on main"; exit 1; }
      - name: Download latest.json and the standard installer from the published release
        run: |
          gh release download "$TAG" --pattern latest.json --dir .
          mkdir installers
          # The glob matches only the standard installer, not *_x64-offline-setup.exe.
          gh release download "$TAG" --pattern 'Conflux_*_x64-setup.exe' --dir installers
          ls -la installers
      - name: Fetch the currently published manifest (if any)
        run: |
          if gh release view updater-beta --json assets --jq '.assets[].name' 2>/dev/null | grep -qx latest.json; then
            gh release download updater-beta --pattern latest.json --output current-latest.json
            echo "currently published: $(node -p 'require("./current-latest.json").version')"
          else
            echo "no manifest published yet; skipping the version-order check"
          fi
      # Signature vs the pubkey in tauri.conf.json, version strictly newer, urls inside this release.
      - name: Verify the manifest before it goes live
        run: |
          CURRENT=()
          [ -f current-latest.json ] && CURRENT=(--current current-latest.json)
          node scripts/verify-updater-manifest.mjs --manifest latest.json --installer-dir installers \
            --conf crates/conflux-desktop/tauri.conf.json --repo "$GITHUB_REPOSITORY" --tag "$TAG" "${CURRENT[@]}"
      - name: Create the updater-beta release if missing
        run: |
          if ! gh release view updater-beta >/dev/null 2>&1; then
            gh release create updater-beta --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Updater manifest (do not delete)" \
              --notes "Holds latest.json, which installed copies of Conflux poll for updates. Overwritten on each published release. Do not delete or publish installers here."
          fi
      - name: Overwrite latest.json
        run: gh release upload updater-beta latest.json --clobber
