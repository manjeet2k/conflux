[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
]

[advisories]
# Vulnerabilities and unmaintained crates fail the check; yanked crates warn.
yanked = "warn"
# Build-time-only proc macro pulled in by Tauri's toolchain; no runtime exposure.
# Remove once Tauri drops it.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; transitive build-time dep of tauri" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    # webpki-roots (Mozilla CA bundle data, via reqwest/rustls). Needs user sign-off.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
