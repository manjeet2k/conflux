[package]
name = "conflux-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
description = "Conflux desktop app (Tauri v2, Windows): multi-interface download accelerator"

[lib]
name = "conflux_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
conflux-core = { path = "../conflux-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
tauri-plugin-notification = "2"
window-vibrancy = "0.8"
tracing-appender = "0.2.5"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2"
semver = "1"
