<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conflux</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --card-bg: #ffffff;
      --text: #1c1c1c;
      --text-sub: #606060;
      --border: #e0e0e0;
      --accent: #0078d4;
      --accent-hover: #106ebe;
      --status-ok: #107c10;
      --status-err: #d13438;
      --status-warn: #ff8c00;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202020;
        --card-bg: #2d2d2d;
        --text: #ffffff;
        --text-sub: #a0a0a0;
        --border: #3d3d3d;
        --accent: #60cdff;
        --accent-hover: #7cd5ff;
        --status-ok: #54b054;
        --status-err: #ff6b6b;
        --status-warn: #ffa500;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text);
      background-color: var(--bg);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 24px;
      height: 24px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--status-warn);
    }
    .dot.connected { background-color: var(--status-ok); }
    .dot.error { background-color: var(--status-err); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-info {
      flex: 1;
    }

    .card-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .card-desc {
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.3;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border);
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      transition: all 0.15s ease;
    }

    .btn:hover {
      background-color: var(--border);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="../icons/icon-32.png" alt="Conflux">
      <span class="brand-title">Conflux</span>
    </div>
    <div id="statusBadge" class="status-badge">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="card">
    <div class="card-row">
      <div class="card-info">
        <div class="card-title">Auto-Intercept</div>
        <div class="card-desc">Hand off browser downloads to Conflux</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="interceptToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button id="openAppBtn" class="btn" style="margin-bottom: 12px;">
    Open Conflux Desktop
  </button>

  <div class="footer">
    <a id="optionsLink">Extension Settings</a>
    <span>v0.2.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
