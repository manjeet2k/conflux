[workspace]
members = [
    "crates/conflux-core",
    "crates/conflux-cli",
    "crates/conflux-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2021"
authors = ["Manjeet Singh <manjeetsgh11@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/manjeet2k/conflux"
homepage = "https://github.com/manjeet2k/conflux"
keywords = ["download-manager", "multi-interface", "bandwidth-aggregation", "http-range", "tauri"]
categories = ["network-programming", "command-line-utilities"]
publish = false

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
local-ip-address = "0.6"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
